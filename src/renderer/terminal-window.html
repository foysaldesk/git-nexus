<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Nexus - Terminal</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/terminal-icon.svg">
  <link rel="icon" type="image/png" href="../../assets/terminal-icon.png">
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --term-bg: #300a24;
      --term-header-bg: linear-gradient(180deg, #3d0c2e 0%, #29061e 100%);
      --term-tabbar-bg: #24061a;
      --term-tab-active-bg: #300a24;
      --term-accent: #e95420;
      --term-accent-glow: rgba(233, 84, 32, 0.4);
      --term-swatch: linear-gradient(135deg, #e95420, #77216f);
      --term-fg: #dfdbd2;
      --term-fg-muted: rgba(255, 255, 255, 0.55);
      --term-fg-hover: #ffffff;
      --term-border: rgba(255, 255, 255, 0.12);
      --term-border-hover: rgba(255, 255, 255, 0.25);
      --term-pill-bg: rgba(255, 255, 255, 0.08);
      --term-btn-bg: rgba(255, 255, 255, 0.06);
      --term-btn-hover-bg: rgba(255, 255, 255, 0.12);
      --term-tab-bg: rgba(255, 255, 255, 0.04);
      --term-tab-hover-bg: rgba(255, 255, 255, 0.09);
      --term-tab-fg: rgba(255, 255, 255, 0.6);
      --term-tab-fg-hover: #ffffff;
      --term-tab-active-fg: #ffffff;
      --term-tab-active-shadow: 0 -2px 6px rgba(0, 0, 0, 0.3);
      --term-badge-bg: rgba(255, 255, 255, 0.1);
      --term-menu-bg: #25061b;
      --term-menu-item-fg: #dfdbd2;
      --term-menu-item-hover: #380c2a;
      --term-menu-item-hover-fg: #ffffff;
      --term-menu-item-active-bg: rgba(255, 255, 255, 0.1);
      --term-menu-item-active-fg: #ffffff;
      --term-input-bg: rgba(0, 0, 0, 0.35);
      --term-input-fg: #ffffff;
      --term-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--term-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease;
    }

    #standalone-terminal-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background-color: var(--term-bg);
      transition: background-color 0.2s ease;
    }

    /* Top Control Bar */
    .standalone-header {
      height: 40px;
      background: var(--term-header-bg);
      border-bottom: 1px solid var(--term-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 8px;
      user-select: none;
      flex-shrink: 0;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .standalone-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .standalone-brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--term-swatch);
      border-radius: 5px;
      color: #fff;
      box-shadow: 0 0 8px var(--term-accent-glow);
      transition: all 0.2s ease;
    }

    .standalone-cwd-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--term-pill-bg);
      border: 1px solid var(--term-border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--term-fg);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .standalone-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .standalone-action-btn {
      background: var(--term-btn-bg);
      border: 1px solid var(--term-border);
      color: var(--term-fg);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
    }

    .standalone-action-btn:hover {
      background: var(--term-btn-hover-bg);
      border-color: var(--term-border-hover);
      color: var(--term-fg-hover);
    }

    .standalone-action-btn.pinned {
      background: var(--term-accent-glow);
      border-color: var(--term-accent);
      color: var(--term-fg-hover);
      box-shadow: 0 0 6px var(--term-accent-glow);
    }

    /* Tab Bar */
    .terminal-tab-bar {
      background: var(--term-tabbar-bg);
      border-bottom: 1px solid var(--term-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 8px 0;
      gap: 6px;
      flex-shrink: 0;
      user-select: none;
      min-height: 31px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .terminal-tabs-container {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .terminal-tabs-container::-webkit-scrollbar {
      display: none;
    }

    .term-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--term-tab-fg);
      background: var(--term-tab-bg);
      border: 1px solid var(--term-border);
      border-bottom: none;
      border-radius: 5px 5px 0 0;
      cursor: pointer;
      transition: all 0.12s ease;
      max-width: 170px;
      position: relative;
    }

    .term-tab:hover {
      background: var(--term-tab-hover-bg);
      color: var(--term-tab-fg-hover);
    }

    .term-tab.active {
      background: var(--term-tab-active-bg);
      color: var(--term-tab-active-fg);
      border-color: var(--term-accent-glow);
      border-top: 2px solid var(--term-accent);
      font-weight: 600;
      box-shadow: var(--term-tab-active-shadow);
    }

    .term-tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .term-tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--term-tab-fg);
      cursor: pointer;
      padding: 0;
      font-size: 10px;
      transition: all 0.12s ease;
    }

    .term-tab-close:hover {
      background: var(--term-accent-glow);
      color: var(--term-tab-active-fg);
    }

    .btn-add-tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      font-size: 11px;
      color: var(--term-fg);
      background: transparent;
      border: 1px dashed var(--term-border);
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: all 0.12s ease;
      flex-shrink: 0;
    }

    .btn-add-tab:hover {
      background: var(--term-btn-hover-bg);
      color: var(--term-fg-hover);
      border-color: var(--term-accent);
    }

    .tab-shortcut-badge {
      font-size: 9px;
      opacity: 0.7;
      padding: 1px 4px;
      background: var(--term-badge-bg);
      border-radius: 3px;
      margin-left: 2px;
      color: var(--term-fg);
    }

    /* Dropdown Menus */
    .system-term-dropdown, .theme-dropdown {
      position: relative;
    }

    .system-term-menu, .theme-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--term-menu-bg);
      border: 1px solid var(--term-border);
      border-radius: 6px;
      box-shadow: var(--term-shadow);
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .system-term-menu {
      min-width: 190px;
      padding: 4px;
    }

    .system-term-menu.open {
      display: block !important;
      animation: menuFadeIn 0.12s ease-out;
    }

    .theme-menu {
      min-width: 240px;
      max-height: 420px;
      padding: 6px;
    }

    .theme-menu.open {
      display: flex !important;
      flex-direction: column;
      animation: menuFadeIn 0.12s ease-out;
    }

    @keyframes menuFadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-menu-header-bar {
      padding-bottom: 6px;
      border-bottom: 1px solid var(--term-border);
      margin-bottom: 4px;
    }

    .theme-menu-header {
      font-size: 9.5px;
      color: var(--term-accent);
      font-weight: 700;
      padding: 2px 4px 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-search-input {
      width: 100%;
      box-sizing: border-box;
      background: var(--term-input-bg);
      border: 1px solid var(--term-border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: var(--term-input-fg);
      outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }

    .theme-search-input:focus {
      border-color: var(--term-accent);
      box-shadow: 0 0 6px var(--term-accent-glow);
    }

    .theme-menu-list {
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--term-accent-glow) transparent;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .theme-menu-list::-webkit-scrollbar {
      width: 4px;
    }
    .theme-menu-list::-webkit-scrollbar-thumb {
      background: var(--term-accent-glow);
      border-radius: 2px;
    }

    .theme-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 11.5px;
      color: var(--term-menu-item-fg);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.12s, color 0.12s;
    }

    .theme-menu-item:hover {
      background: var(--term-menu-item-hover);
      color: var(--term-menu-item-hover-fg);
    }

    .theme-menu-item.active {
      background: var(--term-menu-item-active-bg);
      color: var(--term-menu-item-active-fg);
      font-weight: 600;
    }

    .theme-swatch-circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid var(--term-border);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .theme-name-label {
      flex: 1;
      white-space: nowrap;
    }

    .theme-active-icon {
      font-size: 12px;
      color: var(--term-accent);
      opacity: 0;
      font-weight: 700;
    }

    .theme-menu-item.active .theme-active-icon {
      opacity: 1;
    }

    .system-term-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-size: 11.5px;
      color: var(--term-menu-item-fg);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: background 0.12s, color 0.12s;
    }

    .system-term-item:hover {
      background: var(--term-menu-item-hover);
      color: var(--term-menu-item-hover-fg);
    }

    /* Terminal Viewports Container */
    #standalone-terminal-container {
      flex: 1;
      position: relative;
      background-color: var(--term-bg);
      overflow: hidden;
      width: 100%;
      height: calc(100vh - 71px);
      transition: background-color 0.2s ease;
    }

    .tab-viewport {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 4px 8px;
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background-color: var(--term-bg);
    }

    .tab-viewport.active {
      display: block;
    }

    .tab-viewport .xterm {
      padding: 2px;
      height: 100%;
    }

    .tab-viewport .xterm-viewport {
      background-color: var(--term-bg) !important;
    }
  </style>
</head>
<body>
  <div id="standalone-terminal-layout">
    <!-- Top Action Bar -->
    <div class="standalone-header">
      <div class="standalone-header-left">
        <div class="standalone-brand-logo" title="Git Nexus Terminal">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </div>
        <div id="terminal-cwd-badge" class="standalone-cwd-pill" title="Current Repository">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="terminal-cwd-text">Terminal</span>
        </div>
      </div>

      <!-- Window Actions -->
      <div class="standalone-header-actions">
        <!-- Clear Button -->
        <button id="btn-standalone-clear" class="standalone-action-btn" title="Clear screen (Ctrl+L)">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear</span>
        </button>

        <!-- Theme Selector Dropdown -->
        <div class="theme-dropdown">
          <button id="btn-standalone-theme" class="standalone-action-btn" title="Change Terminal Color Theme">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"></path>
            </svg>
            <span id="current-theme-label">Ubuntu Dark</span>
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="standalone-theme-menu" class="theme-menu">
            <div class="theme-menu-header-bar">
              <div class="theme-menu-header">
                <span>Color Themes</span>
                <span id="theme-count-badge" style="font-size: 9px; opacity: 0.65; font-weight: 500;"></span>
              </div>
              <input type="text" id="theme-search-input" class="theme-search-input" placeholder="Search themes (e.g. Catppuccin, Gruvbox)..." autocomplete="off" spellcheck="false" />
            </div>
            <div class="theme-menu-list" id="theme-menu-list">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>

        <!-- Always on Top Toggle -->
        <button id="btn-standalone-pin" class="standalone-action-btn" title="Pin window on top of other apps">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span id="pin-text">Pin</span>
        </button>

        <!-- System External Terminal Menu -->
        <div class="system-term-dropdown">
          <button id="btn-standalone-system-term" class="standalone-action-btn" title="Open in external system terminal">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            <span>External</span>
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="standalone-system-menu" class="system-term-menu">
            <div style="font-size: 9.5px; color: var(--term-accent); font-weight: 700; padding: 3px 8px; text-transform: uppercase; letter-spacing: 0.5px;">External Shells</div>
            <button class="system-term-item" data-action="external-term" data-type="git-bash">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="6" y1="3" x2="6" y2="15"></line>
                <circle cx="18" cy="6" r="3"></circle>
                <circle cx="6" cy="18" r="3"></circle>
                <path d="M18 9a9 9 0 0 1-9 9"></path>
              </svg>
              <span>Git Bash</span>
            </button>
            <button class="system-term-item" data-action="external-term" data-type="wt">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
              <span>Windows Terminal</span>
            </button>
            <button class="system-term-item" data-action="external-term" data-type="powershell">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="7 8 11 12 7 16"></polyline>
                <line x1="13" y1="16" x2="17" y2="16"></line>
              </svg>
              <span>PowerShell</span>
            </button>
            <button class="system-term-item" data-action="external-term" data-type="cmd">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
              </svg>
              <span>Command Prompt (CMD)</span>
            </button>

            <div style="border-top: 1px solid var(--term-border); margin: 4px 0;"></div>
            <div style="font-size: 9.5px; color: var(--term-accent); font-weight: 700; padding: 3px 8px; text-transform: uppercase; letter-spacing: 0.5px;">Shortcuts &amp; Access</div>
            <button class="system-term-item" data-action="create-shortcut">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
              <span>Create Desktop Shortcut</span>
            </button>
            <button class="system-term-item" data-action="toggle-context-menu">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              <span id="label-context-menu">Add Right-Click Context Menu</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Multi-Tab Strip Bar -->
    <div class="terminal-tab-bar">
      <div class="terminal-tabs-container" id="terminal-tabs-list">
        <!-- Rendered dynamically -->
      </div>
      <button id="btn-add-tab" class="btn-add-tab" title="New Terminal Tab (Ctrl+Shift+T or Ctrl+T)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New Tab</span>
        <span class="tab-shortcut-badge">Ctrl+T</span>
      </button>
    </div>

    <!-- Terminal Body Viewports Container -->
    <div id="standalone-terminal-container"></div>
  </div>

  <!-- Scripts -->
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="terminal-window.js"></script>
</body>
</html>
